<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Quest Log</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="fx" aria-hidden="true"></div>
<div id="fx2" aria-hidden="true"></div>
<div class="w">

  <header class="card" id="hd">
    <div class="top">
      <div class="brand">
        <img class="logo" id="logo" src="images/logo.png" alt="Logo" data-fb="⚔️">
        <h1>Quest Log</h1>
      </div>
      <div class="tools">
        <button class="ib" data-dd="themes" title="Thèmes" aria-label="Choisir un thème" aria-expanded="false">🎨</button>
        <button class="ib" id="mus" data-dd="mp" title="Musique" aria-label="Ouvrir le lecteur de musique" aria-expanded="false">🎵</button>
        <button class="ib" data-dd="set" title="Paramètres" aria-label="Ouvrir les paramètres" aria-expanded="false">⚙️</button>
      </div>
    </div>

    <div class="card dd thm" id="themes" hidden>
      <button class="tb" data-t="dark" title="Sombre Épuré" aria-label="Sombre Épuré">🌑</button>
      <button class="tb" data-t="cyber" title="Cyber Slate" aria-label="Cyber Slate">🔷</button>
      <button class="tb" data-t="light" title="Clair Doux" aria-label="Clair Doux">☀️</button>
      <button class="tb" data-t="tron" title="Néon Tron" aria-label="Néon Tron">⚡</button>
      <button class="tb" data-t="forest" title="Forêt verdoyante" aria-label="Forêt verdoyante">🌿</button>
      <button class="tb" data-t="dungeon" title="Donjon" aria-label="Donjon">🏰</button>
      <button class="tb" data-t="city" title="Ville de nuit" aria-label="Ville de nuit">🌃</button>
      <button class="tb" data-t="day" title="Ville de jour" aria-label="Ville de jour">🏙️</button>
      <button class="tb" data-t="storm" title="Pluie et orage" aria-label="Pluie et orage">⛈️</button>
      <button class="tb" data-t="rooms" title="Backrooms" aria-label="Backrooms">🟨</button>
      <button class="tb" data-t="moto" title="Moto sous la pluie" aria-label="Moto sous la pluie">🏍️</button>
      <button class="tb" data-t="galaxy" title="Galaxie" aria-label="Galaxie">🌌</button>
    </div>

    <div class="card dd" id="mp" hidden>
      <div class="mp-top"><strong>🎵 Musique</strong><span id="np">Aucune piste</span></div>
      <input type="range" id="sk" min="0" max="100" step="0.1" value="0" aria-label="Position dans la piste">
      <div class="mp-ctl">
        <button class="ib" id="pv" aria-label="Piste précédente">⏮</button>
        <button class="ib" id="pp" aria-label="Lecture / pause">▶</button>
        <button class="ib" id="nx" aria-label="Piste suivante">⏭</button>
        <input type="range" id="vol" min="0" max="1" step="0.01" aria-label="Volume">
      </div>
      <div class="tl" id="tl"></div>
      <button class="btn" id="add" type="button">＋ Ajouter des MP3</button>
      <input type="file" id="mf" accept="audio/mpeg,.mp3" multiple hidden>
    </div>

    <div class="card dd" id="set" hidden>
      <strong>⚙️ Paramètres</strong>
      <label class="sw"><span>🔊 Effets sonores</span><input type="checkbox" id="sfx"><i></i></label>
      <label class="sw"><span>✨ Animations d’ambiance</span><input type="checkbox" id="fxo"><i></i></label>
    </div>

    <div class="sync" id="sync"></div>
    <div class="hero">
      <div class="lv" id="lv" title="Profil"><span class="lvp">👤</span></div>
      <div class="lvn" title="Niveau"><small>NIV.</small><b id="lvn">1</b></div>
      <div class="xp">
        <strong id="rank">Novice</strong> <small id="xpt"></small>
        <div class="track"><div id="bar"></div></div>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><b id="s1">0</b><span>Quêtes totales</span></div>
      <div class="stat"><b id="s2">0</b><span>Terminées</span></div>
      <div class="stat"><b id="s3">0%</b><span>Taux de réussite</span></div>
    </div>
  </header>

  <section class="card" id="qc" style="margin-top:14px">
    <button class="qh" id="new" type="button" aria-expanded="false" aria-controls="qa"><span>＋ Nouvelle quête</span><i class="chev" aria-hidden="true">▾</i></button>
    <div class="acc" id="qa"><div class="acc-in">
    <form id="f">
      <input id="t" class="full" placeholder="Titre de la quête" maxlength="80" required>
      <select id="c" aria-label="Catégorie">
        <option value="main">🔥 Principale</option>
        <option value="side" selected>📜 Secondaire</option>
        <option value="opt">💡 Facultative</option>
        <option value="urg">🚨 Urgente</option>
      </select>
      <input id="ds" placeholder="Description (optionnelle)" maxlength="200">
      <div class="dwrap full">
        <button type="button" class="dbtn" id="dbtn" aria-haspopup="dialog" aria-expanded="false"><span aria-hidden="true">📅</span> <span id="dlbl">Ajouter une échéance</span></button>
        <div class="cal" id="cal" role="dialog" aria-label="Choisir une échéance" hidden>
          <div class="cal-h">
            <button type="button" class="cb" id="cp" aria-label="Mois précédent">‹</button>
            <strong id="cm"></strong>
            <button type="button" class="cb" id="cn" aria-label="Mois suivant">›</button>
          </div>
          <div class="cal-w" aria-hidden="true"><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
          <div class="cal-g" id="cg"></div>
          <div class="cal-f">
            <label class="ct"><span>🕒 Heure limite (optionnelle)</span><input type="time" id="ct"></label>
            <div class="chips">
              <button type="button" class="chip" data-d="0">Aujourd’hui</button>
              <button type="button" class="chip" data-d="1">Demain</button>
              <button type="button" class="chip" data-d="7">Dans 7 j</button>
              <button type="button" class="chip" id="cc">Effacer</button>
            </div>
          </div>
          <div class="cal-r" id="cr" hidden></div>
          <button type="button" class="btn" id="co">OK</button>
        </div>
      </div>
      <div class="picker full" id="dif" role="radiogroup" aria-label="Difficulté"></div>
      <button class="btn full" type="submit">Ajouter la quête</button>
    </form>
    </div></div>
  </section>

  <div class="bar">
    <div class="seg" id="seg">
      <button data-v="todo">⚔️ En cours <span id="n1"></span></button>
      <button data-v="done">🏆 Terminées <span id="n2"></span></button>
    </div>
    <input id="q" type="search" placeholder="Rechercher une quête…" aria-label="Rechercher">
  </div>

  <div class="chips" id="chips">
    <button class="chip" data-c="all">Toutes</button>
    <button class="chip" data-c="main">🔥 Principales</button>
    <button class="chip" data-c="side">📜 Secondaires</button>
    <button class="chip" data-c="opt">💡 Facultatives</button>
    <button class="chip" data-c="urg">🚨 Urgentes</button>
  </div>

  <div id="list"></div>
</div>
<script src="js/script.js"></script>
<script src="js/drive.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</body>
</html>
