<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Quest Log</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="w">

  <header class="card">
    <div class="top">
      <h1>⚔️ Quest Log</h1>
      <div class="tools" id="themes">
        <button class="ib" data-t="dark" title="Sombre Épuré" aria-label="Thème Sombre Épuré">🌑</button>
        <button class="ib" data-t="cyber" title="Cyber Slate" aria-label="Thème Cyber Slate">🔷</button>
        <button class="ib" data-t="light" title="Clair Doux" aria-label="Thème Clair Doux">☀️</button>
        <button class="ib" data-t="synth" title="Synthwave" aria-label="Thème Synthwave">🌆</button>
        <button class="ib" id="snd" title="Activer / couper le son" aria-label="Son">🔊</button>
      </div>
    </div>
    <div class="hero">
      <div class="lv" id="lv">1</div>
      <div class="xp">
        <strong id="rank">Novice</strong> <small id="xpt"></small>
        <div class="track"><div id="bar"></div></div>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><b id="s1">0</b><span>Quêtes totales</span></div>
      <div class="stat"><b id="s2">0</b><span>Terminées</span></div>
      <div class="stat"><b id="s3">0%</b><span>Taux de réussite</span></div>
    </div>
  </header>

  <section class="card" style="margin-top:14px">
    <strong>Nouvelle quête</strong>
    <form id="f">
      <input id="t" class="full" placeholder="Titre de la quête" maxlength="80" required>
      <select id="c" aria-label="Catégorie">
        <option value="main">🔥 Principale</option>
        <option value="side" selected>📜 Secondaire</option>
        <option value="opt">💡 Facultative</option>
        <option value="urg">🚨 Urgente</option>
      </select>
      <input id="ds" placeholder="Description (optionnelle)" maxlength="200">
      <div class="picker full" id="dif" role="radiogroup" aria-label="Difficulté"></div>
      <button class="btn full" type="submit">Ajouter la quête</button>
    </form>
  </section>

  <div class="bar">
    <div class="seg" id="seg">
      <button data-v="todo">⚔️ En cours <span id="n1"></span></button>
      <button data-v="done">🏆 Terminées <span id="n2"></span></button>
    </div>
    <input id="q" type="search" placeholder="Rechercher une quête…" aria-label="Rechercher">
  </div>

  <div class="chips" id="chips">
    <button class="chip" data-c="all">Toutes</button>
    <button class="chip" data-c="main">🔥 Principales</button>
    <button class="chip" data-c="side">📜 Secondaires</button>
    <button class="chip" data-c="opt">💡 Facultatives</button>
    <button class="chip" data-c="urg">🚨 Urgentes</button>
  </div>

  <div id="list"></div>
</div>
<script src="js/script.js"></script>
</body>
</html>
